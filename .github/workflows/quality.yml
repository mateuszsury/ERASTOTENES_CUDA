name: Sieve checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile CUDA without claiming GPU execution
        run: nvcc -std=c++17 sito_cuda/kernel.cu -o /tmp/sieve_cuda
